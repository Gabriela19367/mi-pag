<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FELIZ DIA</title>
<style>
    body {
        background-color: #fdf5ab; /*cambia el color de fondo*/
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
           }
           h1 {
            color: rgb(168, 90, 241);/*cambia el color del titulo principal*/
           }
           p {
            color: rgb(255, 2, 221);
            font-size: 18px;
           }
           image{
            width: 300px;
            border-radius: 10px;
            margin-top: 20px;
           }
           .boton-interactivo {
            background-color: #673ab7;
            color: rgb(255, 219, 61);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
}

            .boton-interactivo:hover {
            background-color: #804aff; /* Cambia de tono al pasar el mouse */
}   
           </style>
</head>
<body>
   <h1>fELIZ DIA DE LAS FLORES AMARILLAS LUMY,
       ERES LA MEJOR AMIGA
   </h1>
  <P>Gracias por estar allí siempre, tu amistad es mi lugar favorito</P>
  <img src="imagen.png" alt="amarilla">
  <br> <!-- Esta etiqueta sirve para dar un salto de línea -->

    <!-- El botón interactivo y su espacio para el mensaje -->
    <button onclick="saludar()" class="boton-interactivo">¡Haz clic!</button>
    <p id="mensaje-secreto" style="font-weight: bold; color: #d81b60; margin-top: 10px;"></p>

    <!-- 3. AQUÍ VA EL JAVASCRIPT (al final del body, antes de cerrar) -->
    <script>
        function saludar() {
            document.getElementById("mensaje-secreto").innerText = "¡te quiero mucho!, Tener tu amistad es como tener un campo entero de flores amarillas ✨🌻💛";
        }
    </script>
</body>
</html>
